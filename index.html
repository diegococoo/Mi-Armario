<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A1D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Probador">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Probador del armario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: probador — maniquí fijo a la izquierda (arriba en móvil) y cuatro bandejas de prendas que se van filtrando */
:root{
  --paper:#F2F3F6; --card:#FFFFFF; --ink:#161D33; --muted:#5B6275; --line:#D7DAE2;
  --accent:#7A1D2E; --accent-soft:#F3E3E6; --gst:rgba(22,29,51,.22); --stage:#E8EAF0; --ok:#2F6B4A;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F121A; --card:#171B26; --ink:#E8EAF1; --muted:#9AA1B3; --line:#2A3041;
  --accent:#E07A8B; --accent-soft:#2C1A21; --gst:rgba(255,255,255,.22); --stage:#1E2331; --ok:#7FC79E; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0F121A; --card:#171B26; --ink:#E8EAF1; --muted:#9AA1B3; --line:#2A3041;
  --accent:#E07A8B; --accent-soft:#2C1A21; --gst:rgba(255,255,255,.22); --stage:#1E2331; --ok:#7FC79E; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1}
.intro{color:var(--muted);margin:8px 0 22px;max-width:62ch}
.app{display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px}
.manq{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.manq .fig{background:var(--stage);border-radius:6px;padding:14px 30px 8px}
.manq svg{width:100%;height:auto;display:block;max-height:46vh}
.sel{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.selrow{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;font-size:13.5px;line-height:1.3}
.selrow i{width:16px;height:16px;border-radius:50%;border:1px solid var(--gst)}
.selrow i.empty{border-style:dashed;background:transparent}
.selrow small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.selrow .none{color:var(--muted)}
.x{font:500 12px var(--body);background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px}
.x:hover{color:var(--accent)}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);padding:2px 2px}
.status b{color:var(--ok);font-weight:500}
.status.done b{color:var(--accent)}
.btns{display:flex;gap:8px}
.btn{flex:1;font:600 14px var(--body);border-radius:999px;padding:10px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.it:focus-visible,.x:focus-visible,.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.trays{display:flex;flex-direction:column;gap:26px;min-width:0}
.tray{min-width:0}
.trh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.trh h2{font-size:22px;font-weight:800}
.trh .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.tog{font:500 12px var(--body);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);cursor:pointer}
.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:14px 0 8px}
.sub:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.it{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px;cursor:pointer;font:500 12px/1.25 var(--body);color:var(--ink);min-width:0}
.it .th{background:var(--stage);border-radius:4px;aspect-ratio:1.15;display:grid;place-items:center;overflow:hidden;max-width:100%}
.it .th svg{width:82%;height:82%;display:block}
.it[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.it[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;display:grid;place-items:center}
.it.off{opacity:.38;cursor:not-allowed}
.it.off span{text-decoration:line-through}
.empty-tray{color:var(--muted);font-size:13.5px;padding:10px 0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px}
.modes button{font:600 13.5px/1.25 var(--body);color:var(--ink);background:transparent;border:0;border-radius:7px;padding:10px 8px;cursor:pointer;text-align:center}
.modes button small{display:block;font:400 11.5px var(--body);color:var(--muted);margin-top:2px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.modes button[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.selrow .nm{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.selrow .nm:hover{color:var(--accent)}
.it .note{font:400 10.5px var(--mono);color:var(--muted);letter-spacing:.02em}
.tray{scroll-margin-top:16px}
:root{--s1:#C2412D;--s2:#D9822B;--s3:#C9A227;--s4:#5E9E4A;--s5:#2F7D4F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#E2705E;--s2:#E89A4E;--s3:#D9BC4F;--s4:#7FBE6A;--s5:#5BBF84}}
:root[data-theme="dark"]{--s1:#E2705E;--s2:#E89A4E;--s3:#D9BC4F;--s4:#7FBE6A;--s5:#5BBF84}
.score{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.score .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.score .num{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.score .lbl{font:600 14px var(--body)}
.score .lbl small{display:block;font:400 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:right}
.bar{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--s1) 0%,var(--s1) 45%,var(--s2) 50%,var(--s2) 60%,var(--s3) 65%,var(--s3) 75%,var(--s4) 80%,var(--s4) 87%,var(--s5) 92%);opacity:.28}
.barwrap{position:relative}
.barfill{position:absolute;inset:0 auto 0 0;height:12px;border-radius:999px;transition:width .35s ease}
.barmark{position:absolute;top:-3px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px);transition:left .35s ease}
.ticks{display:flex;justify-content:space-between;font:400 10px var(--mono);color:var(--muted)}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.3}
.why li{display:grid;grid-template-columns:30px 1fr;gap:6px}
.why b{font:500 11.5px var(--mono);text-align:right}
.why .pos b{color:var(--s5)}.why .neg b{color:var(--s1)}
.score.empty .num{color:var(--muted)}
.it .sc{position:absolute;top:6px;left:6px;min-width:24px;height:20px;padding:0 5px;border-radius:999px;font:600 11px/20px var(--mono);color:#fff;text-align:center}
.legend{font:400 11.5px var(--body);color:var(--muted);margin:-4px 0 0}
.btns{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.barfill,.barmark{transition:none}}
@media (max-width:520px){.modes button{font-size:12.5px;padding:8px 4px}.modes button small{display:none}}
@media (prefers-reduced-motion:no-preference){.it{transition:opacity .2s ease,transform .12s ease}.it:not(.off):hover{transform:translateY(-1px)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static}
  .manq{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
  .manq .fig{padding:8px 10px 4px}
  .sel{margin-top:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
}

/* --- v3: pestañas, contexto, favoritos, historial, estadísticas, prendas --- */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px}
.tabs button{flex:none;font:600 14px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs button .ct{font:500 11px var(--mono);opacity:.7;margin-left:4px}
.tabs button:focus-visible,.chip:focus-visible,.act:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctx{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ctxrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ctxrow>span{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:70px}
.chip{font:500 13px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.modes button:disabled{opacity:.35;cursor:not-allowed}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.15;text-align:center;font:500 11.5px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 4px;cursor:pointer}
.act svg{width:20px;height:20px}
.act[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.act:disabled{opacity:.4;cursor:not-allowed}
.daybtn{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font:500 13.5px var(--body);z-index:20;max-width:calc(100% - 32px);text-align:center}
.sync{font:400 11.5px var(--mono);color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden],#v-probador[hidden]{display:none}
.vh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.vh h2{font-size:24px;font-weight:800}
.vh p{margin:0;color:var(--muted);font-size:13.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:78px 1fr;gap:10px;min-width:0}
.ocard .f{background:var(--stage);border-radius:6px;padding:6px 4px}
.ocard .f svg{width:100%;height:auto;display:block}
.ocard .m{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.3}
.ocard .m b{font:800 20px var(--display)}
.ocard .m .d{font:400 11px var(--mono);color:var(--muted)}
.ocard .m ul{margin:0;padding:0;list-style:none;color:var(--muted);font-size:12px}
.ocard .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.mini{font:500 12px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.mini.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty-v{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;font-size:14px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.stcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stcard h3{font-size:16px;font-weight:700;margin:0}
.stcard p{margin:0;color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi b{display:block;font:800 28px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:14px 1fr 80px 54px;gap:8px;align-items:center;font-size:13px}
.rank i{width:14px;height:14px;border-radius:50%;border:1px solid var(--gst)}
.rank .tr{height:8px;border-radius:4px;background:var(--stage);overflow:hidden}
.rank .tr div{height:100%;background:var(--accent)}
.rank em{font:500 11.5px var(--mono);font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.colbar{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid var(--gst)}
.collg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.collg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1px solid var(--gst);vertical-align:-1px}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
form.add label{display:flex;flex-direction:column;gap:5px;font:500 12px var(--body);color:var(--muted)}
form.add input,form.add select{font:500 14px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:30px;height:30px;border-radius:50%;border:1px solid var(--gst);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.addprev{display:flex;gap:12px;align-items:center}
.addprev .th{width:110px;background:var(--stage);border-radius:6px;aspect-ratio:1.15;display:grid;place-items:center}
.addprev .th svg{width:82%;height:82%}
.it .del{position:absolute;bottom:6px;right:6px;font:600 10px var(--mono);color:var(--muted)}
.it .new{position:absolute;top:6px;right:6px;font:600 9.5px var(--mono);letter-spacing:.06em;background:var(--accent);color:var(--paper);border-radius:3px;padding:2px 4px}
@media (max-width:520px){.acts{grid-template-columns:repeat(4,1fr)}.act{font-size:10.5px}.rank li{grid-template-columns:14px 1fr 50px 50px}}

.wtools{display:flex;gap:8px;flex-wrap:wrap}
.wtools select,.wtools input,#bk-text{font:500 14px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.wtools input{flex:1 1 200px}
#bk-text{width:100%;resize:vertical;font:400 12px var(--mono)}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper)}
.wrow .th{width:56px;aspect-ratio:1.15;background:var(--stage);border-radius:4px;display:grid;place-items:center}
.wrow .th svg{width:84%;height:84%}
.wrow.hid{opacity:.55}
.wrow.edit{grid-template-columns:72px 1fr;align-items:start}
.wtxt{min-width:0;display:flex;flex-direction:column}
.wtxt b{font:600 13.5px var(--body)}
.wtxt span{font-size:12px;color:var(--muted)}
.wbtns{display:flex;gap:6px;flex-wrap:wrap}
.wform{display:flex;flex-direction:column;gap:10px;min-width:0}
.wform label{display:flex;flex-direction:column;gap:4px;font:500 12px var(--body);color:var(--muted)}
.wform input{font:500 14px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.lbl2{font:500 12px var(--body);color:var(--muted);display:block;margin-bottom:4px}
.wsub{font:700 15px var(--display);margin:6px 0 0}
@media (max-width:520px){.wrow{grid-template-columns:48px 1fr}.wrow .wbtns{grid-column:1/-1}}

.th img.ph,.wrow .th img.ph{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
.phcard{border-color:var(--accent);background:linear-gradient(0deg,var(--card),var(--card)),var(--card)}
.phpick{display:inline-block;flex:none;width:auto;text-align:center;cursor:pointer}
.phrow{display:flex;gap:12px;align-items:center}
.phsrc{width:96px;height:96px;object-fit:cover;border-radius:6px}
.phbusy{color:var(--muted);font-size:13.5px}
.pherr{color:var(--s1);font-size:13.5px}
.phitem{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
.phitem.off{opacity:.6}
.phthumbs{display:flex;flex-direction:column;gap:6px}
.phcrop{width:96px;height:96px;border-radius:6px;background:var(--stage)}
.phthumbs .th{width:96px;aspect-ratio:1.15;background:var(--stage);border-radius:6px;display:grid;place-items:center}
.phthumbs .th svg{width:80%;height:80%}
.phsel{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.phsel select{font:500 13.5px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
.phhex{display:inline-flex;align-items:center;gap:6px;font:400 11px var(--mono);color:var(--muted);padding-bottom:8px}
.phhex i{width:16px;height:16px;border-radius:50%;border:1px solid var(--gst)}
.phchk{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--ink)!important;font-weight:600!important}
.phdup{margin:0;font-size:12.5px;color:var(--s2)}
.mini:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:520px){.phitem{grid-template-columns:1fr}.phthumbs{flex-direction:row}}

.keyin{width:100%;font:500 14px var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--ink)}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details[open]{display:flex;flex-direction:column;gap:6px}
</style>

<div class="wrap">
  <h1>Probador del armario</h1>
  <p class="intro">Elige ocasión, tiempo y capas, y toca prendas en cualquier bandeja. Lo que no combina se descarta al momento y cada conjunto lleva su nota de 0 a 100.</p>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <section id="v-probador">
  <div class="app">
    <aside class="side">
      <button type="button" class="btn daybtn" id="day">Outfit del día</button>
      <div class="banner" id="banner" hidden></div>
      <div class="manq">
        <div class="fig" id="fig"></div>
        <div>
          <div class="sel" id="sel"></div>
        </div>
      </div>
      <div class="score" id="score"></div>
      <div class="acts" id="acts"></div>
      <div class="status" id="status"></div>
      <div class="btns">
        <button type="button" class="btn" id="best">Mejor combinación</button>
        <button type="button" class="btn ghost" id="rand">Al azar</button>
        <button type="button" class="btn ghost" id="reset">Empezar de nuevo</button>
      </div>
      <div class="sync" id="sync">Conectando con tu armario guardado…</div>
    </aside>
    <main class="trays">
      <div class="ctx" id="ctx"></div>
      <div class="modes" id="modes" role="group" aria-label="Capas"></div>
      <div class="trays" id="trays"></div>
    </main>
  </div>
  </section>
  <section id="v-fav" class="view" hidden></section>
  <section id="v-hist" class="view" hidden></section>
  <section id="v-stats" class="view" hidden></section>
  <section id="v-add" class="view" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

 return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');}

function search(vars,doms,onLeaf,shuffle){
 const as={};let stop=false;
 function rec(d){
  if(stop)return;
  let best=null;
  for(const v of vars){if(as[v]===undefined&&(best===null||d[v].length<d[best].length))best=v;}
  if(best===null){if(globalOk(as)&&onLeaf(as))stop=true;return;}
  let vals=d[best];if(shuffle){vals=vals.slice().sort(()=>Math.random()-.5);}
  for(const x of vals){
   as[best]=x;const nd={};let dead=false;
   for(const v of vars){
    if(as[v]!==undefined&&v!==best){nd[v]=d[v];continue;}
    if(v===best){nd[v]=[x];continue;}
    const f=d[v].filter(y=>ok(best,x,v,y));
    if(!f.length){dead=true;break;}nd[v]=f;
   }
   if(!dead)rec(nd);
   delete as[best];
   if(stop)return;
  }
 }
 rec(doms);
}

 if(T[id]){T[id]=Object.assign({},T[id],{n:o.n,c:o.c});FAM[id]=o.fam;return;}
 const box=SH[id]||NM[id]||CO[id];if(box){box.n=o.n;box.c=o.c;box.fam=o.fam;return;}

 if(S[id]){S[id]=Object.assign({},S[id],{n:o.n,c:o.c});SFAM[id]=o.fam;return;}

 catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'offline'};}
 let j=null;try{j=await res.json();}catch(e){}
 if(!res.ok){const m=(j&&j.error&&j.error.message)||'';
  if(res.status===401||res.status===403)throw {code:'bad_key'};
  if(res.status===429)throw {code:'rate_limited'};
  if(/credit|balance|billing/i.test(m))throw {code:'no_credit'};

  if(res.status===529||res.status>=500)throw {code:'upstream_error'};
  throw {code:'api_error',message:m};}
 const txt=((j&&j.content)||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
 let out=null;try{out=JSON.parse(txt);}catch(e){const a=txt.indexOf('['),z=txt.lastIndexOf(']');if(a>=0&&z>a){try{out=JSON.parse(txt.slice(a,z+1));}catch(e2){}}}
 if(out==null)throw {code:'invalid_json'};
 return out;
}

function drawCrops(){

function cropRect(box){
 const W=ph.w,H=ph.h;if(!Array.isArray(box)||box.length!==4)return {x:0,y:0,w:W,h:H};
 let [x0,y0,x1,y1]=box.map(Number);if(![x0,y0,x1,y1].every(isFinite))return {x:0,y:0,w:W,h:H};
 if(x1<x0)[x0,x1]=[x1,x0];if(y1<y0)[y0,y1]=[y1,y0];
 const p=.03;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(1,x1+p);y1=Math.min(1,y1+p);
 if(x1-x0<.05||y1-y0<.05)return {x:0,y:0,w:W,h:H};
 return {x:x0*W,y:y0*H,w:(x1-x0)*W,h:(y1-y0)*H};
}
function cropBlob(box,max){

}

/* ---------- Render general ---------- */
const VIEWS=[['probador','Probador'],['fav','Favoritos'],['hist','Historial'],['stats','Estadísticas'],['add','Mi armario']];
function renderTabs(){
 const ct={fav:Object.keys(store.favs).length,hist:Object.keys(store.hist).length,add:Object.keys(store.custom).length};
 document.getElementById('tabs').innerHTML=VIEWS.map(([k,n])=>`<button type="button" id="tab-${k}" data-view="${k}" aria-pressed="${k===view}">${n}${ct[k]?`<span class="ct">${ct[k]}</span>`:''}</button>`).join('');
 VIEWS.forEach(([k])=>{document.getElementById('v-'+k).hidden=k!==view;});
}
function renderAll(){
 renderTabs();
 if(view==='probador')renderProbador();
 if(view==='fav')renderFav();
 if(view==='hist')renderHist();
 if(view==='stats')renderStats();
 if(view==='add')renderAdd();
}
const render=renderAll;

/* ---------- Outfit del día ---------- */
function outfitOfDay(){
 const vars=curVars(),now=new Date();
 const recent={},recentKeys=new Set();
 Object.entries(store.hist).forEach(([d,h])=>{const days=(now-new Date(d+'T12:00:00'))/864e5;if(days<=14)recentKeys.add(h.key);if(days<=3)Object.values(h.o||{}).forEach(id=>{if(id)recent[id]=1;});});
 const empty={p:null,b:null,m:null,c:null,s:null,k:null,w:null};
 let best=null,bs=-1;
 for(let i=0;i<120;i++){let c=0;search(vars,baseDoms(vars,null,empty),as=>{
  if(recentKeys.has(okey(as,vars)))return ++c>=15;
  const r=scoreOf(as,vars);if(!r)return false;
  let s=r.s;['p','b','m'].forEach(v=>{if(as[v]&&recent[as[v]])s-=6;});
  s+=Math.random()*3;
  if(s>bs){bs=s;best=Object.assign({},as);}return ++c>=15;},true);}
 return best;
}

 const wf=t.closest('[data-wearfav]');if(wf){const f=store.favs[wf.dataset.wearfav];if(f){await put('hist',today(),{o:f.o,mode:f.mode,key:f.key,at:new Date().toISOString()});toast('Apuntado en el historial de hoy');}return;}
 const df=t.closest('[data-delfav]');if(df){await del('favs',df.dataset.delfav);toast('Quitado de favoritos');return;}
 const dh=t.closest('[data-delhist]');if(dh){await del('hist',dh.dataset.delhist);toast('Quitado del historial');return;}
 const dc=t.closest('[data-delcu]');if(dc){const id=dc.dataset.delcu;if(dc.dataset.confirm!=='1'){dc.dataset.confirm='1';dc.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{if(dc.isConnected){dc.dataset.confirm='';dc.textContent='Borrar';}},3000);return;}await del('custom',id);toast('Prenda borrada');return;}
 const kb=t.closest('[data-key]');if(kb){const a=kb.dataset.key;
  if(a==='save'){const v=(document.getElementById('key-in').value||'').trim();if(!/^sk-ant-/.test(v)){toast('Esa clave no parece válida. Debe empezar por sk-ant-');return;}APIKEY=v;try{localStorage.setItem(KEYLS,v);}catch(e){}toast('Clave guardada. Ya puedes añadir prendas con foto.');renderAdd();return;}
  if(a==='del'){if(kb.dataset.confirm!=='1'){kb.dataset.confirm='1';kb.textContent='¿Seguro?';return;}APIKEY='';try{localStorage.removeItem(KEYLS);}catch(e){}toast('Clave quitada');renderAdd();return;}
  if(a==='model'){const v=(document.getElementById('model-in').value||'').trim();if(v){APIMODEL=v;try{localStorage.setItem(MODELLS,v);}catch(e){}toast('Modelo guardado');}return;}}
 const pf=t.closest('[data-photo]');if(pf){photoTarget=pf.dataset.photo;const inp=document.getElementById('one-photo');if(inp){inp.value='';inp.click();}return;}
 const pa=t.closest('[data-ph]');if(pa){const a=pa.dataset.ph;
  if(a==='stop'){if(phCtl)phCtl.abort();return;}

  if(a==='reset'){if(ph.src)URL.revokeObjectURL(ph.src);ph={st:'idle',items:[]};renderAdd();return;}
  if(a==='save'){await savePhotoItems();return;}}
 const pc=t.closest('[data-phc]');if(pc){const i=+pc.dataset.phc;ph.items[i].on=pc.checked;renderAdd();return;}
 const ed=t.closest('[data-edit]');if(ed){const id=ed.dataset.edit,o=info(mgr.v,id);mgr.edit=id;mgr.draft={n:o.n,fam:famOf(mgr.v,id)};renderAdd();const i=document.getElementById('ed-name');if(i)i.focus();return;}
 const es=t.closest('[data-esw]');if(es){const i=document.getElementById('ed-name');if(i)mgr.draft.n=i.value;mgr.draft.fam=es.dataset.esw;renderAdd();return;}
 if(t.closest('[data-edcancel]')){mgr.edit=null;renderAdd();return;}
 const sv=t.closest('[data-edsave]');if(sv){const id=sv.dataset.edsave,i=document.getElementById('ed-name');const n=((i&&i.value)||'').trim()||mgr.draft.n;const fam=mgr.draft.fam;const before=famOf(mgr.v,id);
  if(store.custom[id]){const d=Object.assign({},store.custom[id],{n,fam,c:fam!==store.custom[id].fam?PALC[fam]:store.custom[id].c});mgr.edit=null;await put('custom',id,d);}
  else{const prev=store.edits[id]||{};const e=Object.assign({},prev,{n});if(fam!==before){e.fam=fam;e.c=PALC[fam];}mgr.edit=null;await put('edits',id,e);}
  toast('Prenda actualizada');return;}
 const rs=t.closest('[data-edreset]');if(rs){const id=rs.dataset.edreset,prev=store.edits[id]||{};mgr.edit=null;const keep={};['hidden','photo','photoData'].forEach(k=>{if(prev[k])keep[k]=prev[k];});if(Object.keys(keep).length)await put('edits',id,keep);else await del('edits',id);toast('Prenda devuelta a su nombre y color originales');return;}
 const hd=t.closest('[data-hide]');if(hd){const id=hd.dataset.hide;
  if(hd.dataset.confirm!=='1'){hd.dataset.confirm='1';hd.textContent='¿Seguro?';setTimeout(()=>{if(hd.isConnected){hd.dataset.confirm='';hd.textContent=store.custom[id]?'Borrar':'Retirar';}},3000);return;}
  if(store.custom[id]){await del('custom',id);toast('Prenda borrada');}else{await put('edits',id,Object.assign({},store.edits[id]||{},{hidden:true}));toast('Prenda retirada. Puedes recuperarla abajo.');}return;}
 const uh=t.closest('[data-unhide]');if(uh){const id=uh.dataset.unhide,e=Object.assign({},store.edits[id]||{});delete e.hidden;if(Object.keys(e).length)await put('edits',id,e);else await del('edits',id);toast('Prenda recuperada');return;}
 const bk=t.closest('[data-bk]');if(bk){
  if(bk.dataset.bk==='copy'){const txt=JSON.stringify({app:'probador',v:1,at:new Date().toISOString(),data:store});const ta=document.getElementById('bk-text');
   try{await navigator.clipboard.writeText(txt);toast('Copia de seguridad copiada. Pégala en una nota o correo.');}catch(err){if(ta){ta.value=txt;ta.focus();ta.select();}toast('Selecciona el texto del cuadro y cópialo.');}return;}
  if(bk.dataset.bk==='restore'){const ta=document.getElementById('bk-text');let j=null;try{j=JSON.parse(ta.value);}catch(err){}
   if(!j||!j.data){toast('Esa copia no es válida. Pega el texto completo.');return;}
   if(bk.dataset.confirm!=='1'){bk.dataset.confirm='1';bk.textContent='¿Seguro? Se añadirá a lo que ya tienes';setTimeout(()=>{if(bk.isConnected){bk.dataset.confirm='';bk.textContent='Restaurar';}},4000);return;}
   let n=0;for(const c of COLLS)for(const [id,d] of Object.entries(j.data[c]||{})){store[c][id]=d;if(DB){try{await DB.collection(c).doc(id).set(d);}catch(err){}}n++;}
   if(!DB)lsSave();applyCustom();renderAll();toast(`Restaurado: ${n} elementos`);return;}}
 const sw=t.closest('[data-sw]');if(sw){addDraft.fam=sw.dataset.sw;const nm=document.getElementById('add-name');if(nm)addDraft.n=nm.value;renderAdd();return;}

   const side=Math.min(img.naturalWidth,img.naturalHeight);const box={x:(img.naturalWidth-side)/2,y:(img.naturalHeight-side)/2,w:side,h:side};

 curVars().forEach(v=>sel[v]=b[v]);

 dayInfo={key:curKey(),text:`Outfit del día${parts.length?' para '+parts.join(' y '):''}. Evita lo que has llevado estos últimos días.`};
 renderAll();window.scrollTo({top:0});
});
document.getElementById('best').addEventListener('click',()=>{
 const vars=curVars();let best=null,bs=-1;
 for(let i=0;i<120;i++){let c=0;search(vars,baseDoms(vars,null),as=>{const r=scoreOf(as,vars);if(r&&r.s>bs){bs=r.s;best=Object.assign({},as);}return ++c>=15;},true);}
 if(best){vars.forEach(v=>sel[v]=best[v]);renderAll();}
});
document.getElementById('rand').addEventListener('click',()=>{
 const vars=curVars();let got=null;
 search(vars,baseDoms(vars,null),as=>{got=Object.assign({},as);return true;},true);
 if(got){vars.forEach(v=>sel[v]=got[v]);renderAll();}
});
document.getElementById('reset').addEventListener('click',()=>{sel={p:null,b:null,m:null,c:null,s:null,k:null,w:null};renderAll();});
